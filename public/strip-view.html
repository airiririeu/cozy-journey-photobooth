<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Strip</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem 1rem;
        background: linear-gradient(165deg, #1a2e24 0%, #2a2438 100%);
        color: #e8f0ea;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #hint {
        text-align: center;
        max-width: 28rem;
        line-height: 1.5;
      }
      #wrap {
        max-width: 100%;
      }
      #wrap img {
        display: block;
        max-width: min(100vw - 2rem, 480px);
        max-height: 85vh;
        width: auto;
        height: auto;
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <p id="hint">Loading strip…</p>
    <div id="wrap" hidden>
      <picture>
        <img id="strip" alt="Your photo strip" decoding="async" />
      </picture>
    </div>
    <script>
      (function () {
        /** Must match src/app/lib/stripExportDb.ts */
        var DB_NAME = 'bluebooth-strip-export';
        var STORE = 'strip';
        var KEY = 'png';

        var hint = document.getElementById('hint');
        var wrap = document.getElementById('wrap');
        var img = document.getElementById('strip');

        function openDb(cb) {
          var req = indexedDB.open(DB_NAME, 1);
          req.onerror = function () {
            hint.textContent =
              'Could not open storage. Allow site data for this origin, or try another browser.';
          };
          req.onupgradeneeded = function () {
            var db = req.result;
            if (!db.objectStoreNames.contains(STORE)) {
              db.createObjectStore(STORE);
            }
          };
          req.onsuccess = function () {
            cb(req.result);
          };
        }

        function showError(msg) {
          hint.textContent = msg;
          wrap.hidden = true;
        }

        openDb(function (db) {
          try {
            var tx = db.transaction(STORE, 'readonly');
            var g = tx.objectStore(STORE).get(KEY);
            var blob = null;
            g.onerror = function () {
              showError('Could not read the strip from storage.');
            };
            g.onsuccess = function () {
              blob = g.result;
            };
            tx.oncomplete = function () {
              db.close();
              if (!blob) {
                showError(
                  'No strip found. Go back to the booth, finish a strip, then tap “Open strip to save” again.',
                );
                return;
              }
              var url = URL.createObjectURL(blob);
              img.onload = function () {
                hint.innerHTML =
                  'Right-click the strip → <strong style="color:#d4c2ef">Save Image As…</strong>';
                wrap.hidden = false;
              };
              img.onerror = function () {
                URL.revokeObjectURL(url);
                showError('Could not display the strip image.');
              };
              img.src = url;
            };
            tx.onerror = function () {
              db.close();
              showError('Could not read the strip from storage.');
            };
          } catch (e) {
            db.close();
            showError('Storage error. Try turning off strict blocking for this site.');
          }
        });
      })();
    </script>
  </body>
</html>
